<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skidkalendern 2026/27</title>
<style>
  /* Cold winter palette: icy backgrounds, deep navy accent. Biathlon = warm ember, cross-country = ice blue. */
  :root{--bg:#eaf2f8;--bg2:#dbe9f4;--card:#ffffff;--text:#0b1f33;--muted:#4f647a;--line:#cfdeea;--bia:#c2410c;--xc:#0369a1;--accent:#12355b;--accent-ink:#ffffff;--warn:#a16207;--shadow:0 1px 2px rgba(11,31,51,.06),0 4px 14px rgba(11,31,51,.06)}
  @media (prefers-color-scheme:dark){:root{--bg:#07111b;--bg2:#0c1b2b;--card:#0f2033;--text:#e6f1fa;--muted:#8fa6bb;--line:#1d3550;--bia:#ff8f5e;--xc:#5cc8ff;--accent:#38bdf8;--accent-ink:#04202f;--warn:#fbbf24;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35)}}
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,var(--bg2) 0,var(--bg) 260px) no-repeat,var(--bg);color:var(--text);font:16px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:860px;margin:0 auto;padding:24px 16px 48px}
  h1{margin:0 0 4px;font-size:1.7rem;letter-spacing:-.01em}
  .sub{color:var(--muted);margin:0 0 18px;font-size:.92rem}
  .next{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:12px;padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
  .next small{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:.72rem}
  .next .t{font-size:1.15rem;font-weight:650;margin-top:2px}
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;align-items:center}
  button.chip{border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 13px;border-radius:999px;font:inherit;font-size:.88rem;cursor:pointer}
  button.chip:hover{border-color:var(--accent)}
  button.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  button.chip:focus-visible,.races summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
  h2{font-size:.82rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:24px 0 8px}
  .ev{display:grid;grid-template-columns:110px 1fr auto;gap:4px 14px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--bia);border-radius:12px;padding:10px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
  .ev.xc{border-left-color:var(--xc)}
  .ev.past{opacity:.55}
  .ev.live{outline:2px solid var(--accent);outline-offset:0}
  .date{font-weight:650;font-variant-numeric:tabular-nums}
  .name{font-weight:650}
  .place{color:var(--muted);font-size:.9rem}
  .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
  .tag{font-size:.72rem;border-radius:6px;padding:2px 7px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .tag.bia{color:var(--bia);border-color:var(--bia)}.tag.xc{color:var(--xc);border-color:var(--xc)}
  .tag.live{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .races{grid-column:1/-1}.races summary{cursor:pointer;color:var(--xc);font-size:.85rem;font-weight:600}.ev:not(.xc) .races summary{color:var(--bia)}
  .races ul{list-style:none;margin:6px 0 0;padding:0;font-size:.88rem}.races li{display:flex;gap:10px;padding:3px 0;border-top:1px solid var(--line)}.races li b{min-width:62px;font-variant-numeric:tabular-nums}.races li b.tm{min-width:44px;color:var(--xc)}.ev:not(.xc) .races li b.tm{color:var(--bia)}.races li.pastr{opacity:.5}.races .rn{color:var(--muted);font-size:.78rem;margin-top:4px}
  .warn{grid-column:1/-1;color:var(--warn);font-size:.82rem}
  .empty{color:var(--muted);padding:20px 0}
  footer{margin-top:28px;color:var(--muted);font-size:.8rem}
  footer a{color:var(--xc)}
  @media(max-width:560px){.ev{grid-template-columns:1fr}.tags{justify-content:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Skidkalendern 2026/27</h1>
  <p class="sub">Världscupen i skidskytte och längdskidor samt mästerskap. Svensk tid (datum).</p>

  <div class="next" id="next"></div>

  <div class="filters" id="filters">
    <button class="chip" data-k="sport" data-v="all" aria-pressed="true">Alla sporter</button>
    <button class="chip" data-k="sport" data-v="biathlon" aria-pressed="false">Skidskytte</button>
    <button class="chip" data-k="sport" data-v="xc" aria-pressed="false">Längdskidor</button>
    <span class="sep"></span>
    <button class="chip" data-k="type" data-v="all" aria-pressed="true">Alla typer</button>
    <button class="chip" data-k="type" data-v="wc" aria-pressed="false">Världscup</button>
    <button class="chip" data-k="type" data-v="champ" aria-pressed="false">Mästerskap</button>
    <span class="sep"></span>
    <button class="chip" id="past" aria-pressed="false">Visa avslutade</button>
  </div>

  <div id="list"></div>
  <footer>
    Datumen är sammanställda från Wikipedia och FasterSkier/ProXC och kan ändras – kontrollera mot
    <a href="https://www.biathlonworld.com/calendar">IBU</a> och <a href="https://www.fis-ski.com/DB/cross-country/calendar-results.html">FIS</a>.
    Uppdaterad <span id="upd"></span>. Tävlingar markerade med ⚠ har oklara datum.
  </footer>
</div>
<script src="data.js"></script>
<script>
const SPORT = {biathlon:"Skidskytte", xc:"Längdskidor"};
const TYPE = {wc:"Världscup", champ:"Mästerskap"};
const state = {sport:"all", type:"all", past:false};
const MON = ["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];
const MONTH = ["Januari","Februari","Mars","April","Maj","Juni","Juli","Augusti","September","Oktober","November","December"];
const d = s => { const [y,m,dd] = s.split("-").map(Number); return new Date(y, m-1, dd); };
const today = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();
const DAY = 864e5;
const fmt = (a,b) => { const x=d(a), y=d(b);
  if (a===b) return `${x.getDate()} ${MON[x.getMonth()]}`;
  return x.getMonth()===y.getMonth() ? `${x.getDate()}–${y.getDate()} ${MON[y.getMonth()]}` : `${x.getDate()} ${MON[x.getMonth()]} – ${y.getDate()} ${MON[y.getMonth()]}`; };
const status = e => d(e.end) < today ? "past" : d(e.start) <= today ? "live" : "future";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const when = e => { const s=status(e);
  if (s==="live") return "Pågår nu";
  const n = Math.round((d(e.start)-today)/DAY); return n===1 ? "Imorgon" : `Om ${n} dagar`; };

const events = window.EVENTS.slice().sort((a,b) => d(a.start)-d(b.start) || d(a.end)-d(b.end));

function renderNext(){
  const el = document.getElementById("next");
  const up = events.filter(e => status(e)!=="past");
  if (!up.length){ el.innerHTML = "<small>Nästa tävling</small><div class='t'>Säsongen är slut</div>"; return; }
  const live = up.filter(e => status(e)==="live");
  const nxt = up.find(e => status(e)==="future");
  const row = e => `<div class="t">${esc(e.name)} – ${esc(e.place)} <span class="place">(${SPORT[e.sport]}, ${fmt(e.start,e.end)} · ${when(e)})</span></div>`;
  el.innerHTML = (live.length ? "<small>Pågår just nu</small>" + live.map(row).join("") : "")
               + (nxt ? `<small${live.length?' style="display:block;margin-top:8px"':''}>Nästa tävling</small>` + row(nxt) : "");
}

function racesHtml(e, open){
  const r = (window.RACES||{})[e.sport+"|"+e.start]; if (!r) return "";
  const li = r.slice().sort((x,y)=> x[0]<y[0]?-1: x[0]>y[0]?1 : (x[1]||"").padStart(5,"0")<(y[1]||"").padStart(5,"0")?-1:1).map(([dt,tm,t]) => `<li class="${d(dt)<today?"pastr":""}"><b>${fmt(dt,dt)}</b><b class="tm">${tm?esc(tm.replace(".",":")):""}</b><span>${esc(t)}</span></li>`).join("");
  return `<details class="races"${open?" open":""}><summary>${r.length} lopp</summary><ul>${li}</ul><div class="rn">${esc((window.RACE_NOTES||{})[e.sport]||"")}</div></details>`;
}

function render(){
  const list = events.filter(e => (state.sport==="all"||e.sport===state.sport) && (state.type==="all"||e.type===state.type) && (state.past || status(e)!=="past"));
  const root = document.getElementById("list");
  if (!list.length){ root.innerHTML = "<div class='empty'>Inga tävlingar att visa.</div>"; return; }
  let html="", cur="";
  const nearest = list.find(e => status(e)!=="past"); // ongoing or next upcoming in the current view
  for (const e of list){
    const s = d(e.start), key = `${MONTH[s.getMonth()]} ${s.getFullYear()}`;
    if (key!==cur){ html += `<h2>${key}</h2>`; cur=key; }
    const st = status(e);
    html += `<div class="ev ${e.sport} ${st}">
      <div class="date">${fmt(e.start,e.end)}</div>
      <div><div class="name">${esc(e.name)}${e.confirmed===false?" ⚠":""}</div><div class="place">${esc(e.place)}, ${esc(e.country)}</div></div>
      <div class="tags">${st==="live"?'<span class="tag live">Pågår</span>':st==="future"?`<span class="tag">${when(e)}</span>`:""}
        <span class="tag ${e.sport==="xc"?"xc":"bia"}">${SPORT[e.sport]}</span><span class="tag">${TYPE[e.type]}</span></div>
      ${racesHtml(e, e===nearest)}
      ${e.note?`<div class="warn">⚠ ${esc(e.note)}</div>`:""}
    </div>`;
  }
  root.innerHTML = html;
}

document.getElementById("filters").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.id==="past"){ state.past=!state.past; b.setAttribute("aria-pressed", state.past); }
  else { state[b.dataset.k]=b.dataset.v;
    document.querySelectorAll(`button[data-k=${b.dataset.k}]`).forEach(x => x.setAttribute("aria-pressed", x===b)); }
  render();
});
document.getElementById("upd").textContent = window.UPDATED;
renderNext(); render();
</script>
</body>
</html>
